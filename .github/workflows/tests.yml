name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Engine code only needs numpy; the model stack (torch, sentence-transformers, ...)
      # is skipped to keep CI fast, so the real-model test is skipped too.
      - name: Install dependencies
        run: python -m pip install "numpy>=2.0" pytest

      - name: Run tests
        run: python -m pytest tests -v -rs

      # Exercises the Micro-JIT (VirtualAlloc on Windows, mmap on Linux) and the full engine flow
      - name: Run demo (mock embeddings)
        run: python demo.py --mock
